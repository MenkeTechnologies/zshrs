pluginGroup=com.menketechnologies.zshrs
pluginName=zshrs-intellij
pluginRepositoryUrl=https://github.com/MenkeTechnologies/zshrs

# Bumped in lockstep with zshrs Cargo.toml (workspace version)
pluginVersion=0.11.7

# Supported IDE range. 2024.2 = build 242. Platform LSP API is paid-IDE only.
pluginSinceBuild=242
pluginUntilBuild=261.*

platformType=IU
platformVersion=2024.2.4

# JVM
javaVersion=17

# Pin the JVM Gradle uses so Kotlin doesn't choke trying to parse a
# Java-25/26 version string (Kotlin 2.0.21 only knows about <=24).
# `/usr/libexec/java_home` defaults to the newest installed JDK
# regardless of what `java -version` reports.
org.gradle.java.home=/Users/wizard/Library/Java/JavaVirtualMachines/corretto-17.0.4.1/Contents/Home

kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC
