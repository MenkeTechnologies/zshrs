[package]
name = "zshrs"
version.workspace = true
edition = "2021"
description = "The first compiled Unix shell — bytecode VM, worker pool, AOP intercept, Rkyv caching"
license = "MIT"
authors = ["MenkeTechnologies"]
repository = "https://github.com/MenkeTechnologies/zshrs"
homepage = "https://menketechnologies.github.io/zshrs/"
documentation = "https://docs.rs/zshrs"
readme = "README.md"
keywords = ["shell", "zsh", "bytecode", "terminal", "unix"]
categories = ["command-line-utilities"]
exclude = [
    "/tests/",
    "/.github/",
    "/test_data/",
    "/test_corpus/",
    "**/*parity*",
    "/docs/",
    "/scripts/",
    "/bench/",
    "/fish/",
    "/completions/",
    "/zshrs_dump.*",
    "/examples/"
]


[workspace.package]
version = "0.11.42"
edition = "2021"
license = "MIT"
authors = ["MenkeTechnologies"]


[lib]
name = "zsh"
path = "src/lib.rs"

[[bin]]
name = "zshrs"
path = "bins/zshrs.rs"

# Plugin-Framework-Agnostic State-Modification Recorder. See docs/RECORDER.md.
# Cargo refuses to build this bin without --features recorder, which is the
# mechanism that keeps every recorder symbol out of the default `zshrs`
# binary (Rule 1: zero recorder code in default build).
[[bin]]
name = "zshrs-recorder"
path = "bins/zshrs-recorder.rs"
required-features = ["recorder"]

# `zd` — standalone HTTP client for zshrs-daemon (see docs/DAEMON_AS_SERVICE.md).
# Same separation principle as zshrs-recorder: NOT a `zshrs --client` mode;
# a separate binary so non-zshrs shells can `cargo install --bin zd` without
# pulling in the shell. required-features gate keeps ureq+base64 out of the
# default zshrs build.
[[bin]]
name = "zd"
path = "bins/zd.rs"
required-features = ["zd"]

# Folded-in compsys binary (compsys was merged into this crate;
# see commit "fold compsys into main"). `compsys-test` and `menu-demo`
# were deleted alongside the dup builtin modules they exercised.
[[bin]]
name = "bench-autoload"
path = "bins/bench-autoload.rs"

[dependencies]
ctrlc = "3"
atty = "0.2"
reedline = "0.47.0"
nu-ansi-term = "0.50"
zshrs-daemon = { workspace = true, optional = true }
fusevm = { version = "0.14.0", features = ["jit-disk-cache"] }
regex = "1.11"
glob = "0.3"
libc = "0.2"
indexmap = "2"
parking_lot = "0.12"
thiserror = "2"
nix = { version = "0.29", features = ["signal", "process", "term", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex-lite = "0.1"
dirs = "5"
bitflags = "2"
tempfile = "3"
chrono = "0.4"
os_pipe = "1"
hostname = "0.4"
libm = "0.2"
rand = "0.8"
unicode-width = "0.2"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
tracing-chrome = "0.7"
tracing-flame = { version = "0.2", optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true, default-features = false, features = ["http-listener"] }
walkdir = "2.5"
crossbeam-channel = "0.5"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "1"
filetime = "0.2.27"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "signal", "time", "sync", "macros"] }
byteorder = "1"
rkyv = { version = "0.7", features = ["validation", "archive_le", "size_32"] }
memmap2 = "0.9"
sha2 = "0.10"
notify = "6"
notify-debouncer-mini = "0.4"
crossterm = "0.27"
zstd = "0.13"
# Optional — enabled together by the `zd` feature for the bins/zd.rs
# HTTP client. Also re-used by tests/daemon_http.rs (which always
# enables them via dev-dependencies below).
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = ["daemon"]
# `daemon` enables the zshrs-daemon dep. Disable with --no-default-features
# to compile zshrs lib without dragging the daemon crate into the build —
# useful while the daemon is mid-refactor in a concurrent session and the
# port-only lib work shouldn't depend on it. Stubs in src/lib.rs cover the
# few `crate::daemon::*` references when this feature is off.
daemon = ["zshrs-daemon"]
# Plugin-Framework-Agnostic State-Modification Recorder (PFA-SMR).
# OFF by default — every recorder symbol is `#[cfg(feature = "recorder")]`
# gated and deleted by rustc when this feature is off, satisfying
# docs/RECORDER.md's "zero recorder code in default `zshrs` binary" rule.
# Built into the separate `zshrs-recorder` binary only. Implies `daemon`
# because the recorder's whole purpose is to ship its bundle to the
# daemon at end-of-run via IPC.
recorder = ["daemon"]
# `zd` — standalone HTTP CLI for zshrs-daemon. OFF by default so the
# main `zshrs` build doesn't drag in ureq+base64. Enable via
# `cargo install --bin zd --features zd` (Cargo's required-features
# mechanism enforces the gate).
zd = ["dep:ureq", "dep:base64"]
profiling = []
flamegraph = ["tracing-flame"]
# `zsh-debug` — enables DPUTS / DPUTS1 / DPUTS2 debug-assertion macros
# (Src/zsh.h:2914-2920). Mirrors zsh's `--enable-zsh-debug` configure
# flag: stock zsh ships with `#ifdef DEBUG` un-set so DPUTS is a no-op;
# zshrs matches that contract by gating the macros on this feature
# rather than `cfg(debug_assertions)` (which is active for every
# `cargo build` and produced spurious "shouldn't-happen" assertion
# noise during normal interactive use).
zsh-debug = []
prometheus = ["metrics", "metrics-exporter-prometheus"]

[dev-dependencies]
tempfile = "3"
# ureq + base64 are normal optional deps above (gated by `zd` feature
# for bins/zd.rs); dev-deps re-list them so tests/daemon_http.rs gets
# them unconditionally without forcing every `cargo test` to enable
# the `zd` feature flag.
ureq = { version = "2", default-features = false, features = ["json"] }
base64 = "0.22"

[workspace]
members = [".", "daemon"]


# Single source of truth for inter-crate path-dep versions. Updated by
# `scripts/bp.sh` together with `[workspace.package].version` above so a
# single `bp.sh <new-version>` run touches one file. Members reference
# these via `compsys.workspace = true` etc.
[workspace.dependencies]
zshrs-daemon = { path = "daemon", version = "0.11.35" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
