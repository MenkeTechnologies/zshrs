[package]
name = "zshrs"
version.workspace = true
edition = "2021"
description = "The first JIT-compiled Unix shell — bytecode VM, Cranelift JIT, worker pool, AOP intercept, Rkyv caching"
license = "MIT"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]
repository = "https://github.com/MenkeTechnologies/zshrs"
homepage = "https://menketechnologies.github.io/zshrs/"
documentation = "https://docs.rs/zshrs"
readme = "README.md"
keywords = ["shell", "zsh", "bytecode", "terminal", "unix"]
categories = ["command-line-utilities"]
# Keep the published crate lean: ship `src/`, `bins/`, the workspace member
# crates, README/LICENSE — nothing else. Everything below stays in git for
# local/CI use but is omitted from `cargo package` / the crates.io tarball.
# Mirrors strykelang's exclude set.
#
# NOTE: exclude entries name directories that exist in the repo. A glob such as
# the old `**/*parity*` also matched `bins/parity-fuzz.rs`, the source of the
# declared `[[bin]] parity-fuzz` target, and would drop a build input from the
# tarball.
exclude = [
    "/.github/",
    "/tests/",
    "/test/",
    "/test_data/",
    "/test_corpus/",
    "/examples/",
    "/docs/",
    "/editors/",
    "/scripts/",
    "/bench/",
    "/vendor/",
    "/completions/",
    "/zshrs_dump.*",
    "/tmux",
    "/zterm_columns",
    "/.module_audit.md",
    "/TODO.md",
]


[workspace.package]
version = "0.12.41"
edition = "2021"
license = "MIT"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]


[lib]
name = "zsh"
path = "src/lib.rs"
# `staticlib` produces libzsh.a so `zbuild --native` can link AOT-compiled
# objects (fusevm::aot) against the zsh runtime into a standalone executable.
# `lib` keeps the normal rlib for the binaries and tests.
crate-type = ["lib", "staticlib"]

[[bin]]
name = "zshrs"
path = "bins/zshrs.rs"

# Plugin-Framework-Agnostic State-Modification Recorder. See docs/RECORDER.md.
# Cargo refuses to build this bin without --features recorder, which is the
# mechanism that keeps every recorder symbol out of the default `zshrs`
# binary (Rule 1: zero recorder code in default build).
[[bin]]
name = "zshrs-recorder"
path = "bins/zshrs-recorder.rs"
required-features = ["recorder"]

# `zd` — standalone HTTP client for zshrs-daemon (see docs/DAEMON_AS_SERVICE.md).
# Same separation principle as zshrs-recorder: NOT a `zshrs --client` mode;
# a separate binary so non-zshrs shells can `cargo install --bin zd` without
# pulling in the shell. required-features gate keeps ureq+base64 out of the
# default zshrs build.
[[bin]]
name = "zd"
path = "bins/zd.rs"
required-features = ["zd"]

# Folded-in compsys binary (compsys was merged into this crate;
# see commit "fold compsys into main"). `compsys-test` and `menu-demo`
# were deleted alongside the dup builtin modules they exercised.
[[bin]]
name = "bench-autoload"
path = "bins/bench-autoload.rs"

# Differential parity fuzzer: generates thousands of grammar-driven shell
# snippets and diffs `zsh -fc` vs `zshrs --zsh -f -c` to surface parity gaps in
# bulk. Feature-gated so `rand`-driven fuzz code stays out of the default build.
#   cargo build --features parity-fuzz --bin parity-fuzz
#   ./target/debug/parity-fuzz --count 5000
[[bin]]
name = "parity-fuzz"
path = "bins/parity-fuzz.rs"
required-features = ["parity-fuzz"]

# Aggregated parity suite — every tests/parity/*_parity.rs is a module of
# tests/parity/main.rs, so the whole suite builds/runs as one binary:
#   cargo test --test parity            (run all)
#   cargo test --test parity zpwr       (filter by module)
[[test]]
name = "parity"
path = "tests/parity/main.rs"

[dependencies]
ctrlc = "3"
atty = "0.2"
zshrs-daemon = { workspace = true, optional = true }
# Native (Rust) plugin host: `zmodload -R <dylib>` dlopen's third-party
# cdylibs through the stable C ABI in the `znative` crate. libloading
# is the foundational Rust dlopen wrapper (cross-platform dlopen/dlsym).
# See src/extensions/plugin_host.rs and docs/PLUGINS.md.
libloading = "0.8"
znative = { workspace = true }
fusevm = { version = "0.25.0", features = ["jit", "jit-disk-cache", "aot", "ffi", "rkyv-archive"] }
regex = "1.11"
# zsh/pcre needs PCRE features the `regex` crate cannot express — zero-width
# lookahead/lookbehind and backreferences (Src/Modules/pcre.c wraps libpcre2,
# which has them). fancy-regex keeps the `regex` engine for patterns it can
# handle and falls back to a backtracking VM for the rest.
fancy-regex = "0.18"
glob = "0.3"
libc = "0.2"
indexmap = "2"
parking_lot = "0.12"
thiserror = "2"
nix = { version = "0.29", features = ["signal", "process", "term", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex-lite = "0.1"
dirs = "5"
bitflags = "2"
tempfile = "3"
chrono = "0.4"
os_pipe = "1"
hostname = "0.4"
libm = "0.2"
rand = "0.8"
unicode-width = "0.2"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
tracing-chrome = "0.7"
tracing-flame = { version = "0.2", optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true, default-features = false, features = ["http-listener"] }
walkdir = "2.5"
crossbeam-channel = "0.5"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "1"
filetime = "0.2.27"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "signal", "time", "sync", "macros"] }
byteorder = "1"
rkyv = { version = "0.7", features = ["validation", "archive_le", "size_32"] }
memmap2 = "0.9"
sha2 = "0.10"
notify = "6"
notify-debouncer-mini = "0.4"
crossterm = "0.27"
zstd = "0.13"
# Optional — enabled together by the `zd` feature for the bins/zd.rs
# HTTP client. Also re-used by tests/daemon_http.rs (which always
# enables them via dev-dependencies below).
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = ["daemon", "aot-hook"]
# `aot-hook` compiles `fusevm_aot_register_builtins` — the `#[no_mangle]` symbol
# fusevm's AOT runtime resolves by name when it links a native binary against
# `libzsh.a` (see src/extensions/aot.rs). ON by default so `zbuild --native`
# keeps working from an ordinary build. A crate that depends on zshrs as a
# *library* and provides its own AOT hook (strykelang does) must take
# `default-features = false`, or the two `#[no_mangle]` definitions collide at
# link time — under `lto = "fat"` that surfaces as a bare
# "failed to load bitcode of module zsh-….rcgu.o".
aot-hook = []
# `daemon` enables the zshrs-daemon dep. Disable with --no-default-features
# to compile zshrs lib without dragging the daemon crate into the build —
# useful while the daemon is mid-refactor in a concurrent session and the
# port-only lib work shouldn't depend on it. Stubs in src/lib.rs cover the
# few `crate::daemon::*` references when this feature is off.
daemon = ["zshrs-daemon"]
# Plugin-Framework-Agnostic State-Modification Recorder (PFA-SMR).
# OFF by default — every recorder symbol is `#[cfg(feature = "recorder")]`
# gated and deleted by rustc when this feature is off, satisfying
# docs/RECORDER.md's "zero recorder code in default `zshrs` binary" rule.
# Built into the separate `zshrs-recorder` binary only. Implies `daemon`
# because the recorder's whole purpose is to ship its bundle to the
# daemon at end-of-run via IPC.
recorder = ["daemon"]
# `zd` — standalone HTTP CLI for zshrs-daemon. OFF by default so the
# main `zshrs` build doesn't drag in ureq+base64. Enable via
# `cargo install --bin zd --features zd` (Cargo's required-features
# mechanism enforces the gate).
zd = ["dep:ureq", "dep:base64"]
# `parity-fuzz` — differential zsh/zshrs fuzzer binary. OFF by default so the
# fuzz driver never compiles into the shipping shell. `rand` is already a
# non-optional dep, so this is a pure build gate (required-features on the bin).
parity-fuzz = []
profiling = []
flamegraph = ["tracing-flame"]
# `zsh-debug` — enables DPUTS / DPUTS1 / DPUTS2 debug-assertion macros
# (Src/zsh.h:2914-2920). Mirrors zsh's `--enable-zsh-debug` configure
# flag: stock zsh ships with `#ifdef DEBUG` un-set so DPUTS is a no-op;
# zshrs matches that contract by gating the macros on this feature
# rather than `cfg(debug_assertions)` (which is active for every
# `cargo build` and produced spurious "shouldn't-happen" assertion
# noise during normal interactive use).
zsh-debug = []
prometheus = ["metrics", "metrics-exporter-prometheus"]

[dev-dependencies]
tempfile = "3"
# ureq + base64 are normal optional deps above (gated by `zd` feature
# for bins/zd.rs); dev-deps re-list them so tests/daemon_http.rs gets
# them unconditionally without forcing every `cargo test` to enable
# the `zd` feature flag.
ureq = { version = "2", default-features = false, features = ["json"] }
base64 = "0.22"

[workspace]
members = [".", "daemon", "znative"]


# Single source of truth for inter-crate path-dep versions. Updated by
# `scripts/bp.sh` together with `[workspace.package].version` above so a
# single `bp.sh <new-version>` run touches one file. Members reference
# these via `compsys.workspace = true` etc.
[workspace.dependencies]
zshrs-daemon = { path = "daemon", version = "0.12.41" }
znative = { path = "znative", version = "0.12.41" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
