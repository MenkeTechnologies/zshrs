# cross-rs per-target Docker image overrides.
#
# src/ported/modules/{cap,db_gdbm}.rs declare `#[link(name = "...")]` for
# cap + gdbm. The default `ghcr.io/cross-rs/aarch64-unknown-linux-gnu`
# image ships gcc-cross + libc6:arm64 but NOT these dev headers, so
# cargo's linker invocation fails with `cannot find -lgdbm`.
#
# No terminal library appears here any more: terminfo is read by pure Rust
# (src/extensions/terminfo_db.rs), so there is nothing to cross-install and
# no `-ltinfo` to resolve.
#
# `pre-build` runs once per cross-build inside the Docker image
# before cargo. Enable arm64 / armhf multiarch then `apt-get install`
# the matching `*-dev:<arch>` packages so the cross linker finds the
# arm64 .so files.
#
# Mirror is the same dance for armhf / i686 / riscv64 — each cross
# target needs its libs in its own multiarch dir.

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update",
    "apt-get install -y libgdbm-dev:$CROSS_DEB_ARCH libcap-dev:$CROSS_DEB_ARCH",
]

[target.arm-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update",
    "apt-get install -y libgdbm-dev:$CROSS_DEB_ARCH libcap-dev:$CROSS_DEB_ARCH",
]

[target.i686-unknown-linux-gnu]
pre-build = [
