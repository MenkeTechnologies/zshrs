name: zsh master oracle
description: >
  Build (or restore from cache) the reference zsh the parity suites compare
  against — the upstream development tree the port follows, not a released
  zsh (tests/parity/oracle.rs) — into ~/.cache/zshrs/zsh-oracle via
  scripts/build_zsh_oracle.sh, and export ZSHRS_ORACLE_ZSH to later steps.
inputs:
  commit:
    description: >
      zsh-users/zsh commit the port's `c:` citations point at
      (ZSH_PATCHLEVEL zsh-5.9.0.3-test-476-g8cc5ead, see README
      "Compatibility measurement"). Move it together with the port.
    default: 8cc5eade5ff80de1dca7bd27509eddca4f849f29
outputs:
  zsh:
    description: Path of the oracle binary.
    value: ${{ steps.export.outputs.zsh }}
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/zshrs/zsh-oracle
        key: zsh-oracle-${{ runner.os }}-${{ runner.arch }}-${{ inputs.commit }}-${{ hashFiles('scripts/build_zsh_oracle.sh') }}
    - name: Install build dependencies (ubuntu)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y autoconf libncurses-dev libpcre2-dev
    - name: Install build dependencies (macOS)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install autoconf pcre2
    - name: Build the oracle
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        src="$RUNNER_TEMP/zsh-src"
        # A full clone: $ZSH_PATCHLEVEL comes from `git describe` and needs the tags.
        git clone -q https://github.com/zsh-users/zsh.git "$src"
        git -C "$src" checkout -q -B oracle "${{ inputs.commit }}"
        sh scripts/build_zsh_oracle.sh "$src"
    - id: export
      shell: bash
      run: |
        zsh="$HOME/.cache/zshrs/zsh-oracle/bin/zsh"
        "$zsh" -f -c 'print -r -- "zsh oracle: $ZSH_VERSION $ZSH_PATCHLEVEL"'
        echo "ZSHRS_ORACLE_ZSH=$zsh" >> "$GITHUB_ENV"
        echo "zsh=$zsh" >> "$GITHUB_OUTPUT"
