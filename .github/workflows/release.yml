name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build (zshrs + zd + recorder)
        # recorder feature implies daemon (per Cargo.toml). zd has its own
        # required-features gate. One pass builds all three zshrs-crate bins.
        run: cargo build --release --locked --features recorder,zd --bin zshrs --bin zshrs-recorder --bin zd --target ${{ matrix.target }}

      - name: Build (zshrs-daemon binary)
        # zshrs-daemon lives in a separate workspace crate; needs its own -p.
        run: cargo build --release --locked -p zshrs-daemon --bin zshrs-daemon --target ${{ matrix.target }}

      - name: Package zshrs (basic)
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          for b in zshrs zd; do
            strip "$b" 2>/dev/null || true
          done
          tar czf ../../../zshrs-${{ github.ref_name }}-${{ matrix.target }}.tar.gz zshrs zd
          cd ../../..

      - name: Package zshrs-all (basic + recorder + daemon)
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          for b in zshrs zd zshrs-recorder zshrs-daemon; do
            strip "$b" 2>/dev/null || true
          done
          tar czf ../../../zshrs-all-${{ github.ref_name }}-${{ matrix.target }}.tar.gz zshrs zd zshrs-recorder zshrs-daemon
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: zshrs-${{ matrix.target }}
          path: zshrs-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: zshrs-all-${{ matrix.target }}
          path: zshrs-all-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  plugin:
    name: Build IntelliJ plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Cache Gradle + IntelliJ Platform SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            editors/intellij/.intellijPlatform
          key: ${{ runner.os }}-gradle-${{ hashFiles('editors/intellij/build.gradle.kts', 'editors/intellij/gradle.properties', 'editors/intellij/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build plugin zip
        # -x test skips the test task (CI has its own IntelliJ plugin
        # tests job). -x buildSearchableOptions skips heavy IDE indexing.
        run: ./gradlew buildPlugin --no-daemon -x test -x buildSearchableOptions

      - name: Locate plugin zip
        id: plugin_zip
        run: |
          zip_path=$(ls build/distributions/*.zip | head -1)
          echo "path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $zip_path)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: zshrs-intellij-plugin
          path: editors/intellij/${{ steps.plugin_zip.outputs.path }}

  publish:
    name: Publish GitHub Release
    needs: [build, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Attach BOTH the Rust binary tarballs (per-target) and the
          # IntelliJ plugin zip (single file from the `plugin` job).
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.tar.gz artifacts/*.zip

  homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 sums
        id: sha
        shell: bash
        run: |
          for f in artifacts/*.tar.gz; do
            base=$(basename "$f")
            sum=$(sha256sum "$f" | awk '{print $1}')
            # zshrs-all-vX.Y.Z-target.tar.gz → all_<target>
            # zshrs-vX.Y.Z-target.tar.gz     → <target>
            if [[ "$base" == zshrs-all-* ]]; then
              key="all_$(echo "$base" | sed 's/zshrs-all-v[^-]*-//; s/\.tar\.gz//; s/-/_/g')"
            else
              key=$(echo "$base" | sed 's/zshrs-v[^-]*-//; s/\.tar\.gz//; s/-/_/g')
            fi
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@v6
        with:
          repository: MenkeTechnologies/homebrew-menketech
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' from VERSION (e.g. v1.2.3 → 1.2.3).
          VERSION="${VERSION#v}"
          cd tap
          cat > Formula/zshrs.rb <<'FORMULA_HEAD'
          class Zshrs < Formula
            desc "The first compiled Unix shell — drop-in zsh replacement with bytecode JIT, AOP, worker pool"
            homepage "https://github.com/MenkeTechnologies/zshrs"
            license "MIT"
          FORMULA_HEAD
          cat >> Formula/zshrs.rb <<EOF
            version "${VERSION}"

            on_macos do
            on_arm do
              url "https://github.com/MenkeTechnologies/zshrs/releases/download/v${VERSION}/zshrs-v${VERSION}-aarch64-apple-darwin.tar.gz"
              sha256 "${{ steps.sha.outputs.aarch64_apple_darwin }}"
            end
            on_intel do
              url "https://github.com/MenkeTechnologies/zshrs/releases/download/v${VERSION}/zshrs-v${VERSION}-x86_64-apple-darwin.tar.gz"
              sha256 "${{ steps.sha.outputs.x86_64_apple_darwin }}"
            end
            end

            on_linux do
            on_intel do
              url "https://github.com/MenkeTechnologies/zshrs/releases/download/v${VERSION}/zshrs-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${{ steps.sha.outputs.x86_64_unknown_linux_gnu }}"
            end
            end

            def install
            bin.install "zshrs"
            bin.install "zd"
            end

            test do
              assert_match "hi", shell_output("#{bin}/zshrs -c \'echo hi\'")
            end
          end
          EOF

      - name: Update zshrs-all formula
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          cd tap
          cat > Formula/zshrs-all.rb <<'FORMULA_HEAD'
          class ZshrsAll < Formula
            desc "Full zshrs install — shell + zd client + recorder + daemon"
            homepage "https://github.com/MenkeTechnologies/zshrs"
            license "MIT"
            conflicts_with "zshrs", because: "both install zshrs and zd"
          FORMULA_HEAD
          cat >> Formula/zshrs-all.rb <<EOF
            version "${VERSION}"

            on_macos do
            on_arm do
              url "https://github.com/MenkeTechnologies/zshrs/releases/download/v${VERSION}/zshrs-all-v${VERSION}-aarch64-apple-darwin.tar.gz"
              sha256 "${{ steps.sha.outputs.all_aarch64_apple_darwin }}"
            end
            on_intel do
              url "https://github.com/MenkeTechnologies/zshrs/releases/download/v${VERSION}/zshrs-all-v${VERSION}-x86_64-apple-darwin.tar.gz"
              sha256 "${{ steps.sha.outputs.all_x86_64_apple_darwin }}"
            end
            end

            on_linux do
            on_intel do
              url "https://github.com/MenkeTechnologies/zshrs/releases/download/v${VERSION}/zshrs-all-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${{ steps.sha.outputs.all_x86_64_unknown_linux_gnu }}"
            end
            end

            def install
            bin.install "zshrs"
            bin.install "zd"
            bin.install "zshrs-recorder"
            bin.install "zshrs-daemon"
            end

            test do
              assert_match "hi", shell_output("#{bin}/zshrs -c \'echo hi\'")
              assert_predicate bin/"zshrs-recorder", :exist?
              assert_predicate bin/"zshrs-daemon", :exist?
            end
          end
          EOF

      - name: Push formula update
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/zshrs.rb Formula/zshrs-all.rb
          if git diff --cached --quiet; then
            echo "no changes — formulas already up to date"
            exit 0
          fi
          git commit -m "zshrs: bump zshrs + zshrs-all to ${{ github.ref_name }}"
          git push
