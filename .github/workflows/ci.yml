name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  # Cross-compile to aarch64-linux to catch portability regressions where
  # c_char (= u8 on aarch64-linux, = i8 on x86_64-linux) drifts in libc
  # callers. Compile-only — no test execution on aarch64 (no native
  # runners). Catches the bug class fixed in c48cbf6 (params.rs /
  # utils.rs / ext_builtins.rs hardcoded i8 where c_char was meant).
  cross-aarch64-linux:
    name: Cross-check aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - run: cross check --locked --target aarch64-unknown-linux-gnu

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # zsh is required by tests/zsh_zshrs_demo_equivalence.rs which
      # compares system-zsh stdout vs `zshrs --zsh` stdout for every
      # demo under examples/demos/. macOS-runner ships zsh by default;
      # ubuntu-runner needs an explicit install. Without zsh the
      # equivalence tests silently skip — installing here makes the
      # contract enforced in CI rather than aspirational.
      - name: Install zsh (ubuntu runner)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: cargo test --locked --no-fail-fast

  doc:
    name: Doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

  corpus:
    name: Corpus tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Run zshrs corpus tests
        run: bash test_corpus/run_corpus.sh
        env:
          ZSHRS: ${{ github.workspace }}/target/release/zshrs
      - name: Upload corpus failure log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: corpus-failures-${{ matrix.os }}
          path: test_corpus/corpus_failures.log
          if-no-files-found: ignore
          retention-days: 30

  # ztst job removed: the per-block fresh-spawn wrapper at tests/ztst_runner.rs
  # was a fake-pass (counted failures, never asserted). The corpus exercises
  # interactive ZLE/completion/job-control/signal-trap paths that need a real
  # pty + per-file persistent shell to drive correctly. Replacement is the
  # PTY harness designed in docs/ZTST_PTY_HARNESS.md; not CI-gated until that
  # lands. Local manual runs only via `cargo run --bin ztst-runner` once built.

  recorder-harness:
    # Plugin-Framework-Agnostic State-Modification Recorder (PFA-SMR) ——
    # see docs/RECORDER.md. The harness in tests/recorder_harness.rs runs
    # `zshrs-recorder --no-daemon --file PATH` against tests/recorder_corpus/
    # (synthetic per-kind scripts + verbatim zinit upstream `bin/*.zsh`) and
    # asserts the per-kind event counts the recorder must produce. A
    # regression that misses a dispatcher or double-fires one fails the
    # relevant test with a kind-by-kind diff.
    #
    # Hermetic: --no-daemon skips the end-of-run IPC bundle, so the
    # zshrs-daemon never starts and ~/.cache/zshrs/ is not written.
    name: Recorder harness
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build with --features recorder
        run: cargo build --locked --features recorder --bin zshrs-recorder
      - name: Verify Rule 1 — zero recorder code in default zshrs binary
        # docs/RECORDER.md §"Zero-overhead default binary": the daily-driver
        # `zshrs` must contain ZERO `zsh::recorder::*` module symbols.
        #
        # Match shape: Rust mangles module paths as <byte-length><name>, so
        # the recorder module appears in symbols as `8recorder` (the 8 = byte
        # length of "recorder"). This is precise — it matches the AOP
        # runtime module specifically, not arbitrary functions whose names
        # happen to contain the substring "recorder" (e.g. shell-side
        # `latest_recorder_shard()` which only WALKS THE FILESYSTEM for
        # `*-recorder.rkyv` shards the daemon's recorder produced — not
        # recorder runtime code).
        #
        # Whitelist: the daemon-side `op_recorder_ingest` ingest endpoint
        # always ships in the daemon (different concern; not the
        # shell-runtime AOP layer); `sqlite3RecordError*` from rusqlite is
        # not affected by the precise grep but kept in the whitelist for
        # belt-and-suspenders robustness.
        run: |
          cargo build --locked --bin zshrs
          set -e
          hits=$(nm target/debug/zshrs 2>/dev/null \
            | grep -E '\b8recorder[0-9a-zA-Z_]' \
            | grep -v sqlite3RecordError \
            | grep -v zshrs_daemon \
            | wc -l \
            | tr -d ' ')
          echo "shell-runtime zsh::recorder module symbols in default zshrs: $hits"
          if [ "$hits" -ne 0 ]; then
            echo "FAIL: Rule 1 broken — zsh::recorder code leaked into default zshrs"
            nm target/debug/zshrs 2>/dev/null | grep -E '\b8recorder[0-9a-zA-Z_]' \
              | grep -v sqlite3RecordError | grep -v zshrs_daemon
            exit 1
          fi
      - name: Run recorder harness
        run: cargo test --locked --features recorder --test recorder_harness -- --nocapture

  daemon-http:
    # zshrs-daemon HTTP listener — see daemon/http.rs and
    # docs/DAEMON_AS_SERVICE.md. Spawns the daemon with an isolated
    # XDG_CACHE_HOME + XDG_CONFIG_HOME (so each test owns its own
    # cache / socket / config), points it at a kernel-allocated free
    # port (127.0.0.1:0 → real port via TcpListener probe), and drives
    # `GET /health`, `GET /ops`, `POST /op/ping`, `POST /op/<unknown>`,
    # plus the bearer-token auth path. Hermetic: every test owns a
    # tempdir, no shared state across tests, no external network.
    name: Daemon HTTP
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The integration test spawns `target/debug/zshrs-daemon` (per
      # tests/daemon_http.rs::zshrs_daemon_binary which falls back from
      # CARGO_BIN_EXE_zshrs-daemon to manifest/target/debug). The daemon
      # binary lives in the workspace's `daemon` crate (separate package
      # from `zsh`), so `cargo test -p zsh` does NOT auto-build it. Build
      # it explicitly here so each test's spawn isn't racing.
      - name: Build zshrs-daemon binary the test will spawn
        run: cargo build --locked -p zshrs-daemon --bin zshrs-daemon
      - name: Run daemon HTTP integration tests
        # --test-threads=1 because each test binds its own port + spawns
        # its own daemon; sequential gives clearer per-test diagnostics
        # and avoids the chance of two daemons racing the same XDG_CACHE
        # tempdir cleanup on slow CI runners.
        run: cargo test --locked --test daemon_http -- --test-threads=1 --nocapture

  intellij-plugin:
    name: IntelliJ plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        # Kotlin 2.0.21 pinned by IntelliJ Platform Gradle Plugin 2.16
        # crashes parsing 3-part version strings of newer JDKs. JDK 17
        # is the supported sweet spot — matches editors/intellij/README.md.
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
      - name: Cache Gradle + IntelliJ Platform SDK
        # Caches ~/.gradle/caches AND ~/.gradle/wrapper AND the
        # downloaded IntelliJ Platform JARs (~1 GB) so they don't
        # re-download every CI run. Same shape as strykelang's
        # equivalent job.
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            editors/intellij/.intellijPlatform
          key: ${{ runner.os }}-gradle-${{ hashFiles('editors/intellij/build.gradle.kts', 'editors/intellij/gradle.properties', 'editors/intellij/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Run JUnit tests (lexer, commenter, registry, plugin manifest, settings)
        # `--no-daemon` keeps the gradle process from sticking around
        # for CI; `-x buildSearchableOptions` skips the heavy IDE
        # indexing pass — we only need the test task.
        run: ./gradlew test --no-daemon -x buildSearchableOptions
      - name: Build plugin zip
        # Verifies the full pipeline (compile, instrument, package,
        # search-options indexer) works — catches discontinuous-token
        # contract violations that unit tests miss.
        run: ./gradlew buildPlugin --no-daemon
      - name: Upload plugin zip
        # Make the built `.zip` downloadable from the workflow run so
        # contributors can grab it without rebuilding locally.
        uses: actions/upload-artifact@v6
        with:
          name: zshrs-intellij-plugin
          path: editors/intellij/build/distributions/*.zip
          retention-days: 14
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: intellij-plugin-test-results
          path: editors/intellij/build/test-results/test/
          retention-days: 14

  release-build:
    name: Release Build
    needs: [check, test, doc, corpus, recorder-harness, daemon-http, intellij-plugin]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: zshrs-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zshrs

  docs-gates:
    name: Docs gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/docs-target-blank-rel-noopener.sh
      - run: bash tests/docs-no-http-links.sh
      - run: bash tests/docs-no-inline-handlers.sh

  polish-gates:
    name: Polish gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/man-page-no-trailing-whitespace.sh
      - run: bash tests/man-page-final-newline.sh
      - run: bash tests/man-page-synopsis-section.sh
      - run: bash tests/tests-shell-executable.sh
      - run: bash tests/tests-shell-shebang.sh

  semantic-gates:
    name: Semantic gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/docs-has-h1.sh
      - run: bash tests/docs-no-deprecated-tags.sh
      - run: bash tests/docs-no-placeholder-href.sh

  newline-gates:
    name: Newline + README gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/readme-final-newline.sh
      - run: bash tests/docs-final-newline.sh
      - run: bash tests/workflow-final-newline.sh
      - run: bash tests/cargo-final-newline.sh
      - run: bash tests/readme-has-https-link.sh

  structure-gates:
    name: Structure gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/readme-has-h2-section.sh
      - run: bash tests/readme-has-badges.sh
      - run: bash tests/docs-has-html-closing.sh
      - run: bash tests/docs-has-body-tag.sh
      - run: bash tests/workflow-no-tabs.sh

  parity-fuzz:
    name: Parity fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Build zshrs + fuzzer
        run: |
          cargo build --locked
          cargo build --locked --features parity-fuzz --bin parity-fuzz
      # Generative differential fuzz: `zsh -fc` vs `zshrs --zsh -fc` across
      # grammar-driven cases in each mode. `--verify 3` re-runs every candidate
      # divergence and discards any that doesn't reproduce, rejecting
      # load-contention flakiness. `--baseline` allowlists KNOWN gaps (normalized
      # signatures) so only a NEW divergence fails the build. When a new gap is
      # triaged, add its printed signature line to the matching baseline file.
      # Blocking gates — glob and heredoc are fully clean (empty baseline: any
      # divergence is a regression); stateful and expr allowlist their few
      # known gaps. A NEW divergence in any of these fails the build.
      - name: Fuzz — glob
        run: ./target/debug/parity-fuzz --mode glob --count 5000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/glob.txt --out target/parity-fuzz/ci-glob.txt
      - name: Fuzz — heredoc
        run: ./target/debug/parity-fuzz --mode heredoc --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/heredoc.txt --out target/parity-fuzz/ci-heredoc.txt
      - name: Fuzz — stateful
        run: ./target/debug/parity-fuzz --mode stateful --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/stateful.txt --out target/parity-fuzz/ci-stateful.txt
      - name: Fuzz — expr
        run: ./target/debug/parity-fuzz --mode expr --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/expr.txt --out target/parity-fuzz/ci-expr.txt
      # match / regex / builtin / cmdsub / loop exercise surface no other mode
      # reaches: the (S)(I)(B)(E)(M)(N) substring-match flags, `[[ =~ ]]` and its
      # $MATCH/$match/BASH_REMATCH side effects, the print/echo/read/getopts/eval
      # builtins, command substitution's splitting and `$(<file)` path, and the
      # loop/case-fallthrough forms. All five are clean (empty baseline: any
      # divergence is a regression).
      - name: Fuzz — match
        run: ./target/debug/parity-fuzz --mode match --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/match.txt --out target/parity-fuzz/ci-match.txt
      - name: Fuzz — regex
        run: ./target/debug/parity-fuzz --mode regex --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/regex.txt --out target/parity-fuzz/ci-regex.txt
      - name: Fuzz — builtin
        run: ./target/debug/parity-fuzz --mode builtin --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/builtin.txt --out target/parity-fuzz/ci-builtin.txt
      - name: Fuzz — cmdsub
        run: ./target/debug/parity-fuzz --mode cmdsub --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/cmdsub.txt --out target/parity-fuzz/ci-cmdsub.txt
      - name: Fuzz — loop
        run: ./target/debug/parity-fuzz --mode loop --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/loop.txt --out target/parity-fuzz/ci-loop.txt
      # datetime / alias / stat reach surface no other mode does — zsh/datetime's
      # strftime format specifiers, lexer-level alias expansion (parse-time
      # binding, global + suffix aliases), and zsh/stat's field/format matrix.
      # All three are fully clean (empty baseline: any divergence is a regression).
      - name: Fuzz — datetime
        run: ./target/debug/parity-fuzz --mode datetime --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/datetime.txt --out target/parity-fuzz/ci-datetime.txt
      - name: Fuzz — alias
        run: ./target/debug/parity-fuzz --mode alias --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/alias.txt --out target/parity-fuzz/ci-alias.txt
      - name: Fuzz — stat
        run: ./target/debug/parity-fuzz --mode stat --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/stat.txt --out target/parity-fuzz/ci-stat.txt
      # quote / procsub / autoload / errexit / paramod each carry a SMALL set of
      # triaged, documented gaps (see the header of each baseline file). They are
      # blocking gates against that allowlist: the known gaps are tolerated, any
      # NEW divergence fails the build. Drive the allowlists to empty over time.
      - name: Fuzz — quote
        run: ./target/debug/parity-fuzz --mode quote --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/quote.txt --out target/parity-fuzz/ci-quote.txt
      - name: Fuzz — procsub
        run: ./target/debug/parity-fuzz --mode procsub --count 2000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/procsub.txt --out target/parity-fuzz/ci-procsub.txt
      - name: Fuzz — autoload
        run: ./target/debug/parity-fuzz --mode autoload --count 2000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/autoload.txt --out target/parity-fuzz/ci-autoload.txt
      - name: Fuzz — errexit
        run: ./target/debug/parity-fuzz --mode errexit --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/errexit.txt --out target/parity-fuzz/ci-errexit.txt
      - name: Fuzz — paramod
        run: ./target/debug/parity-fuzz --mode paramod --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/paramod.txt --out target/parity-fuzz/ci-paramod.txt
      # posparam / numfmt / mapfile / pcre / zwc cover the positional-parameter
      # list ($@ vs $* vs argv, shift, slices), numeric RE-RENDERING (typeset -i
      # output base, -F/-E precision, -Z/-L/-R padding, float formatting),
      # zsh/mapfile, the zsh/pcre engine and its `=~` REMATCH_PCRE dispatch, and
      # the zcompile/.zwc digest path that every autoload goes through once a
      # digest exists. All five are clean (empty baseline: any divergence is a
      # regression).
      - name: Fuzz — posparam
        run: ./target/debug/parity-fuzz --mode posparam --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/posparam.txt --out target/parity-fuzz/ci-posparam.txt
      - name: Fuzz — numfmt
        run: ./target/debug/parity-fuzz --mode numfmt --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/numfmt.txt --out target/parity-fuzz/ci-numfmt.txt
      - name: Fuzz — mapfile
        run: ./target/debug/parity-fuzz --mode mapfile --count 2000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/mapfile.txt --out target/parity-fuzz/ci-mapfile.txt
      - name: Fuzz — pcre
        run: ./target/debug/parity-fuzz --mode pcre --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/pcre.txt --out target/parity-fuzz/ci-pcre.txt
      - name: Fuzz — zwc
        run: ./target/debug/parity-fuzz --mode zwc --count 2000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/zwc.txt --out target/parity-fuzz/ci-zwc.txt
      # readb / fd / special cover the `read` builtin's flag matrix, explicit
      # file-descriptor manipulation (exec N>, {v}>, >&N, >&-) and the
      # deterministic shell-maintained parameters (LINENO, ZSH_SUBSHELL, $?,
      # funcstack, pipestatus). fd is the one that caught the shell parking its
      # own log and sqlite handles on fds 3-7. All three are clean; tied carries
      # one documented gap (see its baseline header).
      - name: Fuzz — readb
        run: ./target/debug/parity-fuzz --mode readb --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/readb.txt --out target/parity-fuzz/ci-readb.txt
      - name: Fuzz — fd
        run: ./target/debug/parity-fuzz --mode fd --count 2000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/fd.txt --out target/parity-fuzz/ci-fd.txt
      - name: Fuzz — special
        run: ./target/debug/parity-fuzz --mode special --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/special.txt --out target/parity-fuzz/ci-special.txt
      - name: Fuzz — tied
        run: ./target/debug/parity-fuzz --mode tied --count 2000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/tied.txt --out target/parity-fuzz/ci-tied.txt
      # brace / getopts / assoc / casesel cover brace expansion (ranges, padding,
      # products), the getopts parse loop (OPTIND/OPTARG, clustering, silent
      # mode), associative-array flags/subscripts, and case pattern selection
      # incl. `;&`/`;|` fallthrough and the GLOB_SUBST rule for `$p` vs `$~p`.
      # All clean (empty baseline: any divergence is a regression).
      - name: Fuzz — brace
        run: ./target/debug/parity-fuzz --mode brace --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/brace.txt --out target/parity-fuzz/ci-brace.txt
      - name: Fuzz — getopts
        run: ./target/debug/parity-fuzz --mode getopts --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/getopts.txt --out target/parity-fuzz/ci-getopts.txt
      - name: Fuzz — assoc
        run: ./target/debug/parity-fuzz --mode assoc --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/assoc.txt --out target/parity-fuzz/ci-assoc.txt
      - name: Fuzz — casesel
        run: ./target/debug/parity-fuzz --mode casesel --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/casesel.txt --out target/parity-fuzz/ci-casesel.txt
      # default / anonfn cover the ${x:-w}/${x:=w}/${x:+w}/${x:?m} default-value
      # family across the unset/empty/set states, and anonymous functions
      # (`() { … } args` — positionals, $0, locals, redirs). Both clean.
      - name: Fuzz — default
        run: ./target/debug/parity-fuzz --mode default --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/default.txt --out target/parity-fuzz/ci-default.txt
      - name: Fuzz — anonfn
        run: ./target/debug/parity-fuzz --mode anonfn --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/anonfn.txt --out target/parity-fuzz/ci-anonfn.txt
      # printv / globanchor cover the print builtin's output-shaping flags
      # (-v/-f/-l/-c/-C/-o/-O/-N and their combinations) and the extended-glob
      # pattern anchors the `pattern` mode doesn't reach ((#s)/(#e)/(#cN,M)/
      # (#i), exclusion `x~y`, negation `^x`). Both clean.
      - name: Fuzz — printv
        run: ./target/debug/parity-fuzz --mode printv --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/printv.txt --out target/parity-fuzz/ci-printv.txt
      - name: Fuzz — globanchor
        run: ./target/debug/parity-fuzz --mode globanchor --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/globanchor.txt --out target/parity-fuzz/ci-globanchor.txt
      # whence / zstyle cover command resolution (whence/type/where/command -v/-V,
      # the -w/-v/-a/-m flag matrix over functions/aliases/builtins/reserved
      # words) and the zstyle database (-g/-a/-b/-t/-s/-m/-e/-L/-d, most-specific
      # context matching). Both clean.
      - name: Fuzz — whence
        run: ./target/debug/parity-fuzz --mode whence --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/whence.txt --out target/parity-fuzz/ci-whence.txt
      - name: Fuzz — zstyle
        run: ./target/debug/parity-fuzz --mode zstyle --count 3000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/zstyle.txt --out target/parity-fuzz/ci-zstyle.txt
      # atflag covers the `(@)` word-flag (nojoin=2) and `(A)` array-force
      # (arrasg) composed with subscripts, outer length/join/sort operators,
      # and nested expansions across scalar / array / assoc value sources —
      # the array-vs-scalar SHAPE rules (isarr / LF_ARRAY, c:subst.c:2915,
      # 3881, 4235). One known-gap class baselined (empty-array slice length).
      - name: Fuzz — atflag
        run: ./target/debug/parity-fuzz --mode atflag --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/atflag.txt --out target/parity-fuzz/ci-atflag.txt
      # subexp covers UNQUOTED nested `${${...}[...]}` value semantics: the
      # `(P)` named-ref (Src/subst.c aspar) with a following subscript across
      # scalar / array / assoc referents, and subscript-under-length. Fixed
      # this round: `${${(P)assoc}[key]}` key lookup and `${#${subexp}[N]}`.
      # Known-gap classes baselined: nested bare-assoc value-splat shape and
      # empty-array slice length.
      - name: Fuzz — subexp
        run: ./target/debug/parity-fuzz --mode subexp --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/subexp.txt --out target/parity-fuzz/ci-subexp.txt
      # replace pins the `${name/pat/repl}` / `${name//pat/repl}` substitution
      # engine under extendedglob (anchors, x#/x## zero-or-more, alternation,
      # (#b)/(#m) backreferences). Fixed to a strict gate: the `(#e)` end-anchor
      # zero-width match and top-level alternation first-branch across all
      # replace paths (c:Src/glob.c getmatch + Src/pattern.c patmatch).
      - name: Fuzz — replace
        run: ./target/debug/parity-fuzz --mode replace --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/replace.txt --out target/parity-fuzz/ci-replace.txt
      # nest — deeply nested `${…${…}…}` expansions combining flags, subscripts,
      # modifiers and set/zip operators. Fixed the DQ scalar-collapse of a nested
      # `:^`/`:^^` zip (c:Src/subst.c:3032 via SUBEXP_SCALAR_CTX); one narrow
      # empty-field-split edge remains baselined.
      - name: Fuzz — nest
        run: ./target/debug/parity-fuzz --mode nest --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/nest.txt --out target/parity-fuzz/ci-nest.txt
      # assign — assignment inside a parameter expansion (${n=w}/${n:=w}/${n::=w})
      # with (A)/(AA) array/assoc flags and the `=`/`(s:X:)` split flags. Strict
      # gate: the RHS splits only under spsep/spbreak (c:Src/subst.c:3272), the
      # empty/scalar element shapes match (c:3282-3293), and (AA) odd counts error.
      - name: Fuzz — assign
        run: ./target/debug/parity-fuzz --mode assign --count 4000 --verify 3 --max-report 200 --baseline .github/fuzz-baseline/assign.txt --out target/parity-fuzz/ci-assign.txt
      # Informational — printf is still gap-rich (many distinct diverging format
      # classes), so it is NOT a blocking gate yet; it reports the divergence
      # count for visibility and its corpus is uploaded. Promote to a blocking
      # gate (add --baseline) once the printf gaps are driven down.
      - name: Fuzz — printf (informational)
        continue-on-error: true
        run: ./target/debug/parity-fuzz --mode printf --count 5000 --verify 3 --max-report 400 --out target/parity-fuzz/ci-printf.txt
      # Informational — arith has ONE known gap class: a comma operator inside an
      # array subscript (`${arr[((x), (y)) % 5 + 1]}`). C never string-splits a
      # subscript — mathevalarg (Src/math.c:1534) parses at MPREC_ARG, which stops
      # at the TOP-LEVEL comma and reports where it stopped — whereas zshrs splits
      # on the first comma at any paren depth. Every remaining arith divergence is
      # an instance of that one class; it is informational (not baselined) because
      # each operand combination normalizes to its own signature. Promote to a
      # blocking gate once mathevalarg carries C's `**ss` out-param.
      - name: Fuzz — arith (informational)
        continue-on-error: true
        run: ./target/debug/parity-fuzz --mode arith --count 4000 --verify 3 --max-report 200 --out target/parity-fuzz/ci-arith.txt
      # Informational — the remaining unicode divergences are the byte-mode
      # class: when the MULTIBYTE option is OFF (`unsetopt multibyte`) the
      # length / index / slice / pad / split / char-class sites must count
      # BYTES, but the port always counts characters (C gates them behind
      # Src/utils.c:5611 mb_metacharlenconv / :5654 mb_metastrlenend, which
      # short-circuit to byte length when MULTIBYTE is unset). That is a broad
      # structural change across many sites for a rarely-used option, so it
      # stays informational. FIXED: the `(m)` display-cell padding TRUNCATION
      # now counts wide chars in cells on both sides (c:Src/subst.c:912-1080),
      # so `${(ml:8:)日本語テキスト}` keeps the last 8 CELLS, not 8 chars.
      - name: Fuzz — unicode (informational)
        continue-on-error: true
        run: ./target/debug/parity-fuzz --mode unicode --count 3000 --verify 3 --max-report 200 --out target/parity-fuzz/ci-unicode.txt
      - name: Upload divergence corpora
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-fuzz-divergences
          path: target/parity-fuzz/ci-*.txt
